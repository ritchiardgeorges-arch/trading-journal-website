<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&family=Bebas+Neue&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef6;--panel:#fff;--ink:#14183a;--mut:#6b7094;--line:#d9dcec;--gold:#a67c1f;--gain:#12936a;--loss:#d23a58;--hero:linear-gradient(135deg,#1b2260,#3a2a7a 55%,#6a2f77);--herotx:#f4f1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e20;--panel:#141937;--ink:#eceefb;--mut:#8f95c0;--line:#262d5a;--gold:#e0bb62;--gain:#3fe0a0;--loss:#ff6f8a;--hero:linear-gradient(135deg,#1d2670,#4a2f93 55%,#8a3a86)}}
:root[data-theme="dark"]{--bg:#0b0e20;--panel:#141937;--ink:#eceefb;--mut:#8f95c0;--line:#262d5a;--gold:#e0bb62;--gain:#3fe0a0;--loss:#ff6f8a;--hero:linear-gradient(135deg,#1d2670,#4a2f93 55%,#8a3a86)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
.wrap{max-width:none;width:auto;margin:0 0 0 190px;padding:20px clamp(14px,2.5vw,44px) 48px}
.hero{background:var(--hero);color:var(--herotx);border-radius:22px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between;border:1px solid rgba(224,187,98,.35)}
h1{font:600 clamp(30px,5vw,46px)/1 "Cormorant Garamond",Georgia,serif;margin:0 0 6px;letter-spacing:.01em}
.sub{opacity:.75;font-size:13px}
.net{text-align:right}.net b{font:700 clamp(30px,5vw,44px)/1 "Cormorant Garamond",Georgia,serif;display:block}
.net b.p{color:#6ff0b8}.net b.n{color:#ff8fa6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st span{color:var(--mut);font-size:12px;display:block}.st b{font-size:18px}
.bar{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
.bar h2{font:600 28px "Cormorant Garamond",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 13px}
button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gold{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.15fr;gap:6px}
.dow{color:var(--mut);font-size:12px;text-align:center;padding:4px 0}
.d{min-height:clamp(76px,11vh,120px);border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:7px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.d.out{opacity:.45}
.d.g{background:color-mix(in srgb,var(--gain) var(--a),var(--panel))}
.d.l{background:color-mix(in srgb,var(--loss) var(--a),var(--panel))}
.d.today{box-shadow:0 0 0 2px var(--gold)}
.d i{font-style:normal;font-size:12px;color:var(--mut)}
.d b{font-size:14px}.d small{color:var(--mut);font-size:11px}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.w{min-height:clamp(76px,11vh,120px);border-radius:12px;border:1px dashed var(--gold);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between}
.w i{font-style:normal;font-size:11px;color:var(--gold);font-weight:600}.w b{font-size:15px}
dialog{border:1px solid var(--gold);border-radius:20px;background:var(--panel);color:var(--ink);width:min(640px,94vw);max-height:92vh;padding:22px;margin:auto}
dialog::backdrop{background:rgba(8,10,28,.62)}
dialog h3{font:600 28px "Cormorant Garamond",Georgia,serif;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,select,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=text]{width:110px}input[type=number]{width:120px}
textarea{width:100%;min-height:130px;resize:vertical;line-height:1.55}
.tr{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:10px;background:var(--bg);margin-bottom:5px}
.tr button{padding:2px 8px;margin-left:8px}
.lab{font-weight:700;margin:16px 0 6px;color:var(--gold)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.imgs div{position:relative}.imgs img{width:100%;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.imgs button{position:absolute;top:4px;right:4px;padding:0 7px;border-radius:99px}
#lb{position:fixed;inset:0;background:rgba(5,6,18,.9);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.cal{gap:3px}.d,.w{min-height:64px;padding:4px}.d b{font-size:11px}.w b{font-size:11px}.d small{display:none}.hero{padding:20px}.net{text-align:left}}
html:root:root:root{color-scheme:dark;--bg:#000;--panel:#0c0c0f;--ink:#f3f3f6;--mut:#8b8b96;--line:#1f1f26;--gold:#a78bfa;--gain:#23d6a0;--loss:#ff5d7c;--hero:linear-gradient(135deg,#17123a,#050507 72%)}
.hero{border-color:#2a2540}
.tabs{display:flex;gap:6px;margin:16px 0 0}.tabs button.on{background:var(--gold);color:#0a0a0f;border-color:var(--gold);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.card h4{margin:0 0 8px;font-size:14px;font-weight:700}
.card svg{width:100%;height:auto;display:block}
.stats{grid-template-columns:repeat(5,1fr)}.st b{font-size:22px}.st small{color:var(--mut);font-size:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
[hidden]{display:none!important}
.side{display:flex;flex-direction:column;gap:14px;padding:0 clamp(14px,2.5vw,44px) 40px}
.rm{outline:none;padding:4px 2px;cursor:text;background:none;color:#fff}
.rm:focus{box-shadow:0 0 0 2px var(--gold)}
.side.r .rm{text-align:right}
.w1,.b1{background:none;border:0;color:#fff}.b1{color:#bdbdbd}
.f1{font:italic 600 clamp(22px,2vw,34px)/1.1 'Playfair Display',Georgia,serif}
.f2{font:400 clamp(32px,3vw,54px)/.95 'Bebas Neue',Impact,sans-serif;letter-spacing:.03em}
.f3{font:700 clamp(20px,1.7vw,28px)/1.2 Manrope,system-ui,sans-serif}
.f4{font:500 clamp(14px,1.1vw,17px)/1.4 Manrope,system-ui,sans-serif}
.f5{font:500 clamp(22px,2vw,32px)/1.1 'Cormorant Garamond',Georgia,serif}
.tabs{flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:1px 8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
#jv .card,#nv .card{margin-bottom:10px}
.tabs{position:fixed;left:0;top:0;bottom:0;width:190px;flex-direction:column;flex-wrap:nowrap;gap:8px;margin:0;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 20px;background:var(--panel);border-right:1px solid var(--line);z-index:5}
.tabs::before{content:"Trading Journal";font:600 24px/1.1 'Cormorant Garamond',Georgia,serif;margin-bottom:16px;color:var(--ink)}
.tabs button{text-align:left;width:100%}
#cloud{text-align:center}
@media(max-width:800px){.tabs{position:static;width:auto;flex-direction:row;flex-wrap:wrap;background:none;border:0;padding:0 0 10px}.tabs::before{display:none}.tabs button{width:auto}.wrap{margin-left:0}}
.goalgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px}.mh{text-align:center;color:var(--mut);font-size:11px}
.mc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:11px;background:var(--bg);color:var(--mut)}.mc.tdy{box-shadow:0 0 0 2px var(--gold);color:var(--ink)}
.pb{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;border-radius:99px;transition:width .5s}
#dash{zoom:.88}
.g3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:900px){.g3{grid-template-columns:1fr}}
html:root:root:root[data-theme="light"]{color-scheme:light;--bg:#f3f3f5;--panel:#fff;--ink:#0b0b0f;--mut:#6b6b76;--line:#e1e1e7;--gold:#6a4bd8;--gain:#0f9a72;--loss:#d3314d}
html:root:root:root[data-theme="cozy"]{color-scheme:dark;--bg:#2a1f1a;--panel:#372a23;--ink:#f6e9d8;--mut:#b7a08a;--line:#4b3a31;--gold:#e8a85c;--gain:#9bd18b;--loss:#f08a7e;--hero:linear-gradient(135deg,#5e3d2b,#2f221b 72%);--herotx:#fbefdc}
[data-theme="cozy"] .hero{border-color:#7a5640}
[data-theme="cozy"] .card,[data-theme="cozy"] .st,[data-theme="cozy"] .d,[data-theme="cozy"] .w{border-radius:18px}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
@media(max-width:640px){.st4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><h1>Trading Journal</h1><div class="sub">Log the trades, keep the lessons.</div></div>
    <div class="net"><span class="sub" id="mlabel"></span><b id="mnet">$0</b></div>
  </div>
  <div class="tabs"><button id="tdash" class="on">Dashboard</button><button id="tcal">Calendar</button><button id="teq">Equity Curve</button><button id="tjv">Journal</button><span style="flex:1"></span><span id="cloud" style="color:var(--mut);font-size:12px;align-self:center"></span><button id="th">White mode</button><button id="bk" hidden>Backup</button><button id="rs">Restore</button><input type="file" id="rf" accept=".json" hidden></div>
  <div class="row" id="authbar" style="margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)">
    <span id="authlabel" style="font-size:13px;color:var(--mut)">Sign in to sync your journal across devices.</span>
    <input id="authEmail" type="email" autocomplete="email" placeholder="Email" aria-label="Account email" style="width:min(220px,100%)">
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="Password (min. 6 characters)" aria-label="Account password" style="width:min(220px,100%)">
    <button id="signup">Create account</button><button class="gold" id="signin">Log in</button><button id="signout" hidden>Log out</button>
  </div>
  <div class="bar" id="mbar">
    <button id="prev" aria-label="Previous month">‹</button>
    <h2 id="title"></h2>
    <div><button id="today">Today</button> <button id="next" aria-label="Next month">›</button></div>
  </div>
  <div id="dash">
  <div class="row" style="justify-content:space-between"><span style="color:var(--mut)">Performance overview</span><select id="rng" aria-label="Range"><option value="m">Month shown</option><option value="all">All time</option></select></div>
  <div class="stats" id="stats"></div>
  <div class="g3"><div class="card"><h4>Journal score</h4><div id="radar"></div></div><div class="card"><h4>Net daily P&amp;L</h4><div id="bars"></div></div><div class="card" style="display:flex;flex-direction:column;justify-content:space-between;gap:14px"><h4>Discipline</h4><div id="quote" style="flex:1;display:flex;align-items:center;color:var(--ink);transition:opacity .35s;font-size:clamp(24px,2.4vw,38px)"></div><div><button id="nq">Next reminder</button></div></div><div id="cum" hidden></div></div>
  <div class="g2"><div class="card"><h4>Recent trades</h4><div id="rec"></div></div><div class="card"><h4>Progress tracker</h4><div id="mini"></div></div></div>
  </div>
  <div id="calv" hidden><div class="cal" id="cal"></div></div>
  <div id="eqv" hidden><div class="card">
   <div class="row" style="justify-content:space-between;margin-top:0"><h4 style="margin:0;font-size:18px">Equity Curve <span id="eqlab" style="color:var(--mut);font-weight:500;font-size:13px"></span></h4>
    <div class="row" style="margin:0"><span id="eqc" class="row" style="margin:0" hidden><input type="date" id="eqs" aria-label="Start date"><input type="date" id="eqe" aria-label="End date"></span>
     <select id="eqr" aria-label="Time frame"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="d90">Last 90 Days</option><option value="custom">Custom Range</option><option value="all" selected>All Time</option></select></div></div>
   <div class="st4" id="eqstats"></div>
   <div id="eqchart"></div>
  </div></div>
  <div id="jv" hidden>
   <div class="card"><h4>New journal entry</h4>
    <div class="row"><input type="text" id="jt" placeholder="Title" aria-label="Title" style="flex:1;min-width:160px;width:auto"><select id="jg" aria-label="Type"><option>Plan</option><option>Review</option><option>Lesson</option><option>Idea</option></select></div>
    <textarea id="jx" placeholder="Weekly plan, what you learned, rules to follow, ideas to test..."></textarea>
    <div class="imgs" id="jimgs" style="margin-top:8px"></div>
    <div class="row"><button id="jup">Add pictures</button><input type="file" id="jf" accept="image/*" multiple hidden><button class="gold" id="jsave">Save entry</button></div>
   </div>
   <div id="jlist"></div>
  </div>
</div>
<dialog id="dlg">
  <div class="row" style="justify-content:space-between;margin-top:0"><h3 id="dt"></h3><button id="close">Close</button></div>
  <div id="dtot" style="font-weight:700;font-size:18px"></div>
  <div class="lab">Trades</div>
  <div id="trs"></div>
  <div class="row">
    <input type="text" id="sym" placeholder="Symbol" aria-label="Symbol">
    <select id="side" aria-label="Side"><option>Long</option><option>Short</option></select>
    <input type="number" id="pnl" step="any" placeholder="P&amp;L ($)" aria-label="Profit or loss">
    <button class="gold" id="add">Add trade</button>
  </div>
  <div class="lab">Journal</div>
  <textarea id="note" placeholder="Why did you take these trades? What did you do well, and what will you change tomorrow?"></textarea>
  <div class="lab">Charts &amp; screenshots</div>
  <div class="imgs" id="imgs"></div>
  <div class="row"><button id="upbtn">Add pictures</button><input type="file" id="file" accept="image/*" multiple hidden></div>
</dialog>
<div id="lb"><img alt=""></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const KEY='trading-journal-v1';
let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Storage is full. Remove some pictures to keep saving.')} scheduleCloudSave()}
function save(){persist();if(open)queue(open)}
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'-':n>0?'+':'')+'$'+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:2});
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayPnl=k=>((data[k]||{}).t||[]).reduce((s,t)=>s+t.p,0);
const cls=n=>n>0?'pos':n<0?'neg':'';
let cur=new Date();cur.setDate(1);let open=null;

function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  $('title').textContent=cur.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  $('mlabel').textContent=cur.toLocaleDateString('en-US',{month:'long'})+' net P&L';
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const start=new Date(y,m,1-first.getDay());
  let mx=1,net=0,wd=0,ld=0,best=null,trades=0,wins=0;
  for(let i=1;i<=last.getDate();i++){const k=key(new Date(y,m,i)),e=data[k];if(!e||!(e.t||[]).length)continue;const p=dayPnl(k);mx=Math.max(mx,Math.abs(p));net+=p;p>0?wd++:p<0&&ld++;if(best===null||p>best)best=p;e.t.forEach(t=>{trades++;if(t.p>0)wins++})}
  const nb=$('mnet');nb.textContent=fmt(net);nb.className=net>0?'p':net<0?'n':'';
  $('stats').innerHTML=[['Winning days',wd],['Losing days',ld],['Win rate',trades?Math.round(wins/trades*100)+'%':'–'],['Best day',best===null?'–':fmt(best)]].map(s=>`<div class="st"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('');
  let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat','Week'].map(x=>`<div class="dow">${x}</div>`).join('');
  const tk=key(new Date());let d=new Date(start),wk=0;
  while(d<=last||d.getDay()!==0){
    const k=key(d),e=data[k]||{},has=(e.t||[]).length,p=dayPnl(k),inm=d.getMonth()===m;
    const a=has?Math.round(14+Math.min(Math.abs(p)/mx,1)*34):0;
    h+=`<button class="d ${inm?'':'out'} ${has?(p>=0?'g':'l'):''} ${k===tk?'today':''}" style="--a:${a}%" data-k="${k}"><i>${d.getDate()}${(e.note||(e.i||[]).length)?' ✎':''}</i><span>${has?`<b class="${cls(p)}">${fmt(p)}</b><br><small>${e.t.length} trade${e.t.length>1?'s':''}</small>`:''}</span></button>`;
    wk+=p;
    if(d.getDay()===6){h+=`<div class="w"><i>Week</i><b class="${cls(wk)}">${wk?fmt(wk):'–'}</b></div>`;wk=0}
    d.setDate(d.getDate()+1);
  }
  $('cal').innerHTML=h;renderDash();renderEq();
}
function openDay(k){
  open=k;data[k]=data[k]||{t:[],i:[],note:''};
  const [y,mo,dd]=k.split('-');
  $('dt').textContent=new Date(y,mo-1,dd).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  $('note').value=data[k].note||'';drawDay();
  if(!$('dlg').open)$('dlg').showModal();
}
function drawDay(){
  const e=data[open],p=dayPnl(open);
  $('dtot').innerHTML=`Day P&amp;L <span class="${cls(p)}">${fmt(p)}</span>`;
  $('trs').innerHTML=e.t.length?e.t.map((t,i)=>`<div class="tr"><span>${t.s} · ${t.d}</span><span><b class="${cls(t.p)}">${fmt(t.p)}</b><button data-del="${i}" aria-label="Delete trade">✕</button></span></div>`).join(''):'<div class="sub" style="color:var(--mut)">No trades yet. Add your first one below.</div>';
  $('imgs').innerHTML=e.i.map((s,i)=>`<div><img src="${s}" alt="Trade screenshot"><button data-rm="${i}" aria-label="Remove picture">✕</button></div>`).join('');
}
$('cal').onclick=e=>{const b=e.target.closest('[data-k]');if(b)openDay(b.dataset.k)};
$('close').onclick=()=>$('dlg').close();
$('dlg').onclose=()=>{const e=data[open];if(e&&!e.t.length&&!e.i.length&&!e.note)delete data[open];save();render()};
$('add').onclick=()=>{const p=parseFloat($('pnl').value);if(isNaN(p)){$('pnl').focus();return}
  data[open].t.push({s:($('sym').value.trim()||'Trade').toUpperCase(),d:$('side').value,p});
  $('sym').value='';$('pnl').value='';save();drawDay();render()};
$('trs').onclick=e=>{const b=e.target.closest('[data-del]');if(b){data[open].t.splice(+b.dataset.del,1);save();drawDay();render()}};
$('note').oninput=()=>{data[open].note=$('note').value;save()};
$('upbtn').onclick=()=>$('file').click();
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(f)})}
$('file').onchange=async e=>{for(const f of e.target.files)data[open].i.push(await shrink(f));e.target.value='';save();drawDay();render()};
$('imgs').onclick=e=>{const r=e.target.closest('[data-rm]');if(r){data[open].i.splice(+r.dataset.rm,1);save();drawDay();return}
  if(e.target.tagName==='IMG'){$('lb').firstElementChild.src=e.target.src;$('lb').style.display='flex'}};
$('lb').onclick=()=>$('lb').style.display='none';
$('prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$('next').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$('today').onclick=()=>{cur=new Date();cur.setDate(1);render()};
let goals={p:1000,w:55,d:10};

async function saveCloudState(){

async function loadCloudState(user){

  $('authEmail').hidden=true;$('authPassword').hidden=true;$('signup').hidden=true;$('signin').hidden=true;$('signout').hidden=false;

    const {data:row,error}=await cloudClient.from('journal_data').select('payload').eq('user_id',user.id).maybeSingle();

    if(row&&row.payload){
      const payload=row.payload;
      data=payload.data&&typeof payload.data==='object'?payload.data:{};
      notes=Array.isArray(payload.notes)?payload.notes:[];

async function authAction(kind){
  const email=$('authEmail').value.trim(),password=$('authPassword').value;
  if(!email||!password){cloudStatus('Enter your email and password first.');return;}
  if(password.length<6){cloudStatus('Use a password with at least 6 characters.');return;}
  cloudStatus(kind==='signup'?'Creating account…':'Logging in…');
  try{
    const result=kind==='signup'
      ? await cloudClient.auth.signUp({email,password})
      : await cloudClient.auth.signInWithPassword({email,password});
    if(result.error)throw result.error;
    if(kind==='signup'&&!result.data.session){cloudStatus('Account created. Check your email to confirm, then log in.');return;}
    if(result.data.user)await loadCloudState(result.data.user);
  }catch(err){console.error('Authentication error:',err);cloudStatus(err.message||'Sign-in failed. Check your details.');}
}
